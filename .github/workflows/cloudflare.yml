name: Deploy to Cloudflare

# Builds the site and uploads it to Cloudflare as static files (wrangler.jsonc).
# Does nothing until the repository has the CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets. GitHub Pages (deploy.yml) keeps serving
# cloudzeta.solutions until wrangler.jsonc gets a route for it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Cloudflare secrets
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Cloudflare secrets are not set, so nothing was deployed to Cloudflare."
          fi

      - name: Checkout
        if: steps.cf.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Setup Node
        if: steps.cf.outputs.enabled == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.cf.outputs.enabled == 'true'
        run: npm ci

      - name: Build with Astro
        if: steps.cf.outputs.enabled == 'true'
        run: npx --no-install astro build

      - name: Deploy
        if: steps.cf.outputs.enabled == 'true'
        # Pinned to a commit, not a tag, because this step holds the Cloudflare token.
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.164.0"
          command: deploy
